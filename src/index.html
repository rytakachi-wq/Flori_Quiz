<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flori_Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 表紙 -->
    <section id="screen-cover" class="screen" aria-label="表紙">
      <img class="logo" src="../assets/flori/src/logo.png" alt="フロリ">
      <h1 class="title">Flori_Quiz</h1>
      <img class="flori flori-cover" src="../assets/flori/src/body_wave.webp" alt="手を振るフロリ">
      <p class="bubble">ヤア! ボクはフロリだヨ!<br>ひらめきクイズで あそぼう!</p>
      <button id="btn-start" class="btn btn-main" type="button">はじめる</button>
      <p class="note">1回は5問。ぜんぶ せいかいで 25点!</p>
    </section>

    <!-- 問題画面 -->
    <section id="screen-question" class="screen" aria-label="問題" hidden>
      <header class="status">
        <span id="q-progress" class="chip"></span>
        <span id="q-level" class="chip chip-level"></span>
      </header>
      <div class="stage">
        <img id="q-flori" class="flori flori-small" src="" alt="">
        <p id="q-message" class="bubble" hidden></p>
      </div>
      <p id="q-text" class="question"></p>
      <ol id="q-choices" class="choices"></ol>
      <div id="q-feedback" class="feedback" hidden>
        <p id="q-verdict" class="verdict"></p>
        <p id="q-explanation" class="explanation"></p>
        <button id="btn-next" class="btn btn-main" type="button"></button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen" aria-label="結果" hidden>
      <h2 id="r-title" class="title">けっかはっぴょう!</h2>
      <img class="flori flori-cover" src="../assets/flori/wave_nikkori.png" alt="にっこりするフロリ">
      <p id="r-comment" class="bubble"></p>
      <dl class="scores">
        <div><dt>せいかい</dt><dd id="r-correct"></dd></div>
        <div><dt>とくてん</dt><dd id="r-score"></dd></div>
        <div><dt>さいこうとくてん</dt><dd id="r-best"></dd></div>
      </dl>
      <p id="r-record" class="record" hidden>しんきろく!</p>
      <p id="r-set" class="note" hidden></p>
      <div class="buttons">
        <button id="btn-again" class="btn btn-main" type="button">もういちど あそぶ</button>
        <button id="btn-cover" class="btn btn-sub" type="button">ひょうしへ</button>
      </div>
    </section>

    <!-- 読み込み失敗 -->
    <section id="screen-error" class="screen" aria-label="エラー" hidden>
      <p class="bubble">もんだいを よみこめなかったよ。<br>ページを ひらきなおしてね。</p>
    </section>

  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
